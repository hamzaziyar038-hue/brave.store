<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BRAVE STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff; --mute:rgba(255,255,255,.55); --line:rgba(255,255,255,.2);
  --logo-scale:.40;
  --intro:1.1s;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--ink);min-height:100%}
body{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.intro{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---------- INTRO ---------- */
#intro{
  position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:100;background:#000;
  display:grid;place-items:center;overflow:hidden;
  clip-path:inset(0 0 0 0);transition:clip-path .55s cubic-bezier(.76,0,.24,1);
}
#intro.cut{clip-path:inset(50% 0 50% 0)}
#intro .logo{
  width:min(300px,70vw);height:auto;max-height:38vh;object-fit:contain;display:block;
  animation:grow 4.5s cubic-bezier(.5,0,.15,1) forwards;
}
@keyframes grow{from{transform:scale(1)}to{transform:scale(1.1)}}
#intro .flash{position:absolute;inset:0;background:#0217fd;opacity:0;animation:flash var(--intro) linear forwards}
@keyframes flash{
  0%{opacity:0} 2%{opacity:.3} 9%{opacity:0}
  78%{opacity:0} 88%{opacity:1} 100%{opacity:0}
}
#intro .line{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#fff;opacity:0}
#intro.cut .line{animation:line .55s ease forwards}
@keyframes line{0%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* ---------- SITE ---------- */
.app{
  min-height:100vh;min-height:100dvh;display:grid;
  grid-template-rows:auto minmax(300px,1fr) auto auto;opacity:0;
}
body.ready .app{opacity:1;transition:opacity 1.2s ease .15s}
.brand{
  text-align:center;margin:0;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 0;
  font-size:clamp(13px,1.5vw,16px);font-weight:700;font-stretch:125%;letter-spacing:.5em;text-indent:.5em;
}
.stage{position:relative;min-height:0;cursor:grab}
.stage:active{cursor:grabbing}
.stage::before{
  content:"";position:absolute;inset:4% 10%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.085),rgba(255,255,255,0));
}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.status,.fallback{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,360px);
  text-align:center;font-size:12px;letter-spacing:.2em;color:var(--mute);line-height:1.8;
}
.status[hidden],.fallback[hidden]{display:none}
.fallback p{margin:0 0 16px;letter-spacing:.08em;text-transform:none}
.pick{border:1px solid #fff;padding:13px 22px;font-size:12px;font-weight:600;letter-spacing:.22em;color:#fff}
.pick:hover{background:#fff;color:#000}
.hint{
  position:absolute;left:0;right:0;bottom:10px;margin:0;text-align:center;pointer-events:none;
  font-size:11px;letter-spacing:.16em;color:var(--mute);opacity:0;transition:opacity .8s;
}
.stage.loaded .hint{opacity:1}
.stage .hint.gone{opacity:0}
.panel{
  width:min(100% - 40px,380px);margin:0 auto;padding:6px 0 26px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.swatches{display:flex;gap:4px}
.sw{position:relative;width:40px;height:40px;border-radius:50%}
.sw::before{
  content:"";position:absolute;inset:6px;border-radius:50%;background:var(--c);
  border:1px solid rgba(255,255,255,.32);
}
.sw::after{
  content:"";position:absolute;inset:0;border-radius:50%;border:1px solid #fff;
  opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;
}
.sw[aria-pressed="true"]::after{opacity:1;transform:scale(1)}
.cname{margin:-6px 0 0;font-size:12px;letter-spacing:.2em;color:var(--mute)}
.title{margin:4px 0 0;font-size:clamp(15px,4.2vw,18px);font-weight:600;font-stretch:112%;letter-spacing:.16em;text-align:center}
.sizes{display:flex;gap:8px;justify-content:center}
.size{
  min-width:52px;height:42px;border:1px solid var(--line);
  font-size:12px;font-weight:600;letter-spacing:.12em;transition:background .2s,color .2s,border-color .2s;
}
.size:hover{border-color:#fff}
.size[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.sizes.need{animation:nudge .4s}
@keyframes nudge{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.buy{
  width:100%;height:54px;margin-top:4px;background:#fff;color:#000;border:1px solid #fff;
  font-size:13px;font-weight:700;font-stretch:112%;letter-spacing:.34em;text-indent:.34em;
  transition:background .25s,color .25s,transform .1s;
}
.buy:hover{background:#000;color:#fff}
.buy:active{transform:translateY(1px)}
.foot{
  margin:0;text-align:center;border-top:1px solid var(--line);
  padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 18px);
  font-size:11px;font-weight:500;letter-spacing:.42em;text-indent:.42em;color:var(--mute);
}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:50;
  transform:translate(-50%,8px);max-width:90vw;text-align:center;
  background:#fff;color:#000;padding:12px 18px;font-size:12px;font-weight:600;letter-spacing:.1em;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .sizes.need{animation:none}
  .stage::before{opacity:.8}
}
</style>
</head>
<body class="intro">

<!-- INTRO -->
<div id="intro">
<img src="logo.png" class="logo" alt="BRAVE STORE">
  <div class="flash"></div>
  <div class="line"></div>
</div>

<!-- SITE -->
<div class="app" inert>
  <header class="brand">BRAVE STORE</header>

  <main class="stage" id="stage" aria-label="3D view of the BRAVE hoodie. Drag to rotate, scroll to zoom.">
    <div class="status" id="status">Loading hoodie 0%</div>
    chmod +x ~/Desktop/brave.store/BRAVE.command
    <p class="hint" id="hint">Drag to rotate. Scroll to zoom.</p>
  </main>

  <section class="panel">
    <div class="swatches" id="swatches" role="group" aria-label="Colour"></div>
    <p class="cname" id="cname" aria-live="polite">White</p>
    <h1 class="title">BRAVE HOODIE - 349 DH</h1>
    <div class="sizes" id="sizes" role="group" aria-label="Size"></div>
    <button type="button" class="buy" id="buy">BUY NOW</button>
  </section>

  <footer class="foot">BE BRAVE. WEAR BRAVE.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var intro=document.getElementById('intro'), app=document.querySelector('.app');
  setTimeout(function(){
    intro.classList.add('cut');
    document.body.classList.add('ready');
    app.removeAttribute('inert');
    setTimeout(function(){ intro.remove(); document.body.classList.remove('intro'); }, 700);
  }, 4500);
  setTimeout(function(){
    if(!window.__viewerReady){
      var s=document.getElementById('status');
      s.hidden=false; s.textContent='The 3D viewer could not load. Check your internet connection and reload.';
    }
  }, 9000);
})();
</script>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.__viewerReady = true;
const MODEL_URL = 'hoodie.glb';
const WHATSAPP  = '';
const COLORS = [
  ['White','#FFFFFF'], ['Black','#111111'], ['Chocolate','#5C3A21'],
  ['Bordeaux','#5E1A2B'], ['Pink','#E8A0B4'], ['Dark Green','#1E3A2B']
];
const SIZES = ['S','M','L','XL','XXL'];
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const fallback = document.getElementById('fallback');
const hint = document.getElementById('hint');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 100);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a4a4a, 1.5));
const rig = new THREE.Group(); scene.add(rig);
const key  = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(-2.5, 3, 4);
const fill = new THREE.DirectionalLight(0xffffff, 0.8); fill.position.set(3, 0.5, 4);
const rim  = new THREE.DirectionalLight(0xffffff, 2.2); rim.position.set(3, 2.5, -4);
rig.add(key, fill, rim);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false; controls.rotateSpeed = 0.7; controls.zoomSpeed = 0.8;
controls.minPolarAngle = Math.PI * 0.2; controls.maxPolarAngle = Math.PI * 0.8;
controls.autoRotate = !reduce; controls.autoRotateSpeed = 1.1;
let resume;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resume); hint.classList.add('gone'); });
controls.addEventListener('end',   () => { clearTimeout(resume); resume = setTimeout(() => controls.autoRotate = !reduce, 2500); });
const size = new THREE.Vector3(1, 0.83, 0.27);
let fitDist = 0;
function fit(reset){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const t  = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const nd = Math.max(size.y / 2 / t, size.x / 2 / (t * camera.aspect)) * 1.12 + size.z / 2;
  if (reset || !fitDist) camera.position.set(0, 0.06, 1).setLength(nd);
  else camera.position.multiplyScalar(nd / fitDist);
  fitDist = nd;
  controls.minDistance = nd * 0.45; controls.maxDistance = nd * 1.7;
}
new ResizeObserver(() => fit()).observe(stage);
const target = new THREE.Color(COLORS[0][1]);
let mat = null, chosen = COLORS[0];
function setup(gltf){
  const model = gltf.scene;
  const aniso = renderer.capabilities.getMaxAnisotropy();
  model.traverse(o => {
    if (!o.isMesh) return;
    const m = o.material;
    m.roughness = 1; m.metalness = 0; m.envMapIntensity = 0;
    const rm = m.metalnessMap || m.roughnessMap;
    m.metalnessMap = null; m.roughnessMap = null; if (rm) rm.dispose();
    if (m.map) m.map.anisotropy = aniso;
    m.color.copy(target);
    m.needsUpdate = true;
    mat = m;
  });
  const box = new THREE.Box3().setFromObject(model);
  box.getSize(size);
  model.position.sub(box.getCenter(new THREE.Vector3()));
  scene.add(model);
  fit(true);
  statusEl.hidden = true; fallback.hidden = true;
  stage.classList.add('loaded');
}
function fail(err){ console.error(err); statusEl.hidden = true; fallback.hidden = false; }
const loader = new GLTFLoader();
loader.load(MODEL_URL, setup,
  e => { if (e.lengthComputable) statusEl.textContent = 'Loading hoodie ' + Math.round(e.loaded / e.total * 100) + '%'; },
  fail);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  rig.quaternion.copy(camera.quaternion);
  if (mat) mat.color.lerp(target, 1 - Math.exp(-dt * 9));
  controls.update();
  renderer.render(scene, camera);
});
const sw = document.getElementById('swatches'), cname = document.getElementById('cname');
COLORS.forEach(([name, hex], i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'sw'; b.style.setProperty('--c', hex);
  b.setAttribute('aria-label', name); b.setAttribute('aria-pressed', i === 0);
  b.onclick = () => {
    chosen = COLORS[i]; target.set(hex); cname.textContent = name;
    [...sw.children].forEach((el, j) => el.setAttribute('aria-pressed', j === i));
  };
  sw.appendChild(b);
});
let size_ = null;
const sizesEl = document.getElementById('sizes');
SIZES.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'size'; b.textContent = s; b.setAttribute('aria-pressed', 'false');
  b.onclick = () => {
    size_ = s;
    [...sizesEl.children].forEach(el => el.setAttribute('aria-pressed', el === b));
  };
  sizesEl.appendChild(b);
});
const toast = document.getElementById('toast'); let tt;
function say(msg){
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 2800);
}
document.getElementById('buy').onclick = () => {
  if (!size_) {
    sizesEl.classList.remove('need'); void sizesEl.offsetWidth; sizesEl.classList.add('need');
    say('Choose a size first'); return;
  }
  const msg = `BRAVE HOODIE - ${chosen[0]} - ${size_} - 349 DH`;
  if (WHATSAPP) window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hi BRAVE STORE, I want to order: ' + msg)}`, '_blank', 'noopener');
  else say('Order: ' + msg);
};
</script>
</body>
</html>
